<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS CLF-C02 Study Guide</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; }
    .header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; padding: 2rem; text-align: center; }
    .header h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
    .header p { color: #94a3b8; margin-bottom: 1rem; }
    .badges { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    .badge { padding: 0.3rem 0.8rem; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
    .container { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab { padding: 0.6rem 1.2rem; border-radius: 8px; border: 2px solid #e2e8f0; background: white; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
    .tab.active { background: #3B82F6; border-color: #3B82F6; color: white; }
    .tab:hover:not(.active) { border-color: #3B82F6; color: #3B82F6; }
    .domain-card { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 1rem; overflow: hidden; }
    .domain-header { padding: 1rem 1.2rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; border-left: 5px solid; }
    .domain-header:hover { background: #f8fafc; }
    .domain-title { font-weight: 700; font-size: 1rem; }
    .domain-pct { font-size: 0.8rem; color: #64748b; margin-top: 0.2rem; }
    .domain-arrow { font-size: 1.2rem; transition: transform 0.2s; }
    .domain-arrow.open { transform: rotate(90deg); }
    .topic-list { padding: 0 1.2rem 1rem; border-top: 1px solid #f1f5f9; }
    .topic-item { margin-top: 1rem; }
    .topic-name { font-weight: 600; font-size: 0.9rem; color: #334155; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.5rem; }
    .topic-name::before { content: '▶'; font-size: 0.6rem; color: #94a3b8; }
    .subtopic { font-size: 0.84rem; color: #475569; padding: 0.25rem 0 0.25rem 1rem; border-left: 2px solid #e2e8f0; margin: 0.2rem 0; line-height: 1.5; }
    .tip-card { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 1rem 1.2rem; margin-bottom: 0.75rem; display: flex; gap: 1rem; align-items: flex-start; }
    .tip-num { background: #3B82F6; color: white; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
    .tip-text { font-size: 0.9rem; line-height: 1.6; color: #334155; }
    .tip-text strong { color: #1e293b; }
    .facts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 520px) { .facts-grid { grid-template-columns: 1fr; } }
    .fact-card { background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 0.8rem 1rem; font-size: 0.85rem; line-height: 1.5; }
    .fact-card strong { display: block; color: #1e293b; margin-bottom: 0.2rem; }
    .fact-card span { color: #475569; }
    .nav-links { background: white; border-top: 1px solid #e2e8f0; padding: 1rem; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; margin-top: 2rem; }
    .nav-link { padding: 0.5rem 1rem; background: #f1f5f9; border-radius: 8px; text-decoration: none; color: #334155; font-size: 0.85rem; font-weight: 600; }
    .nav-link:hover { background: #3B82F6; color: white; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const DOMAINS = [
  {
    id: 1, color: '#3B82F6', pct: '24%',
    title: 'Domain 1 — Cloud Concepts',
    topics: [
      {
        name: 'What is Cloud Computing',
        subs: [
          '5 Characteristics: On-demand self-service, Broad network access, Resource pooling, Rapid elasticity, Measured service',
          '3 Deployment Models: Public Cloud (AWS/Azure/GCP), Private Cloud (on-premises), Hybrid Cloud (mix of both)',
          'IaaS — you manage OS up (EC2); PaaS — you manage app/data (Elastic Beanstalk, RDS); SaaS — provider manages everything (Gmail, Salesforce)',
        ]
      },
      {
        name: '6 Advantages of Cloud Computing',
        subs: [
          '1. Trade fixed (CapEx) for variable expense (OpEx)',
          '2. Benefit from massive economies of scale',
          '3. Stop guessing capacity — scale up/down on demand',
          '4. Increase speed and agility — deploy in minutes',
          '5. Stop spending money on running/maintaining data centers',
          '6. Go global in minutes — deploy in multiple AWS Regions',
        ]
      },
      {
        name: 'Architecture Design Principles',
        subs: [
          'Design for failure — assume components will fail; build in redundancy',
          'Loose coupling — decouple components so failures don\'t cascade (SQS, SNS)',
          'Implement elasticity — auto scale up/down with demand',
          'Think parallel — distribute workloads across many small resources',
        ]
      },
    ]
  },
  {
    id: 2, color: '#EF4444', pct: '30%',
    title: 'Domain 2 — Security & Compliance',
    topics: [
      {
        name: 'Shared Responsibility Model',
        subs: [
          'AWS = Security OF the cloud: physical hardware, facilities, network infrastructure, hypervisor',
          'Customer = Security IN the cloud: data, IAM/access management, OS patches, firewall/security group config, encryption',
          'Shifts by service: EC2 → customer patches OS | RDS → AWS patches OS/DB engine | Lambda → AWS manages everything below the function',
        ]
      },
      {
        name: 'IAM (Identity & Access Management)',
        subs: [
          'Users: individual people with long-term credentials',
          'Groups: collection of users; attach policies to groups',
          'Roles: temporary credentials assumed by services/users/external accounts',
          'Policies: JSON documents defining Allow/Deny permissions',
          'Best practices: MFA everywhere, least privilege, never use root for daily work, rotate credentials',
          'Credential Report: audits all IAM users and their credential status',
          'Access Advisor: shows service permissions and last access date',
        ]
      },
      {
        name: 'Key Security Services',
        subs: [
          'Shield Standard — FREE, automatic DDoS protection (Layer 3/4) for all AWS customers',
          'Shield Advanced — paid, enhanced DDoS + 24/7 DDoS response team + cost protection',
          'WAF (Web Application Firewall) — Layer 7, blocks SQL injection, XSS, custom rules',
          'GuardDuty — ML-powered continuous threat detection (unusual API calls, malicious IPs)',
          'Inspector — automated CVE scanning for EC2 instances and containers',
          'Macie — uses ML to find PII and sensitive data in S3 buckets',
          'KMS (Key Management Service) — create/manage/audit encryption keys',
          'CloudHSM — customer-managed hardware security module; AWS has zero key access',
          'Artifact — on-demand access to AWS compliance reports (SOC, PCI DSS, ISO)',
          'Config — tracks resource configuration changes over time; compliance rules',
          'CloudTrail — logs every AWS API call (who, what, when, from where); default 90 days',
          'Secrets Manager — stores/rotates secrets (DB passwords, API keys) automatically',
        ]
      },
    ]
  },
  {
    id: 3, color: '#10B981', pct: '34%',
    title: 'Domain 3 — Technology',
    topics: [
      {
        name: 'Global Infrastructure',
        subs: [
          'Regions: 30+ geographic areas; isolated for compliance and redundancy',
          'Availability Zones: 3+ physically separate data centers per Region; connected by low-latency fiber',
          'Edge Locations: 400+ worldwide; used by CloudFront, Route 53, Global Accelerator',
          'Region selection criteria: Compliance/data residency, Proximity to users, Service availability, Pricing',
        ]
      },
      {
        name: 'EC2 & Compute',
        subs: [
          'Instance types: General (t/m), Compute (c), Memory (r/x), Storage (d/i), Accelerated (p/g)',
          'On-Demand: pay by second, no commitment; best for unpredictable workloads',
          'Reserved Instances: 1 or 3 year, up to 72% savings; best for steady-state workloads',
          'Spot Instances: up to 90% off, can be interrupted; best for fault-tolerant batch jobs',
          'Savings Plans: flexible commitment to $/hr; applies to EC2, Lambda, Fargate',
          'Dedicated Hosts: physical server for compliance/licensing requirements',
          'Lambda: serverless function execution, max 15 minutes, pay per invocation/duration',
          'ECS/EKS: container orchestration; Fargate = serverless containers (no EC2 management)',
          'Elastic Beanstalk: PaaS — deploy code, AWS handles infrastructure provisioning',
          'CloudFormation: IaC — define infrastructure as YAML/JSON templates',
        ]
      },
      {
        name: 'Storage',
        subs: [
          'S3: object storage, 11 nines (99.999999999%) durability, unlimited storage',
          'S3 Standard → Standard-IA → One-Zone-IA → Glacier Instant → Glacier Flexible → Deep Archive → Intelligent-Tiering',
          'EBS (Elastic Block Store): block storage, attached to single EC2 in same AZ',
          'EFS (Elastic File System): managed NFS file system, shared across multiple EC2, multi-AZ',
          'Snow Family: Snowcone (8TB, edge), Snowball Edge (80TB, offline transfer), Snowmobile (100PB, data center migration)',
          'Storage Gateway: hybrid storage — connects on-premises apps to S3/EBS/Glacier',
        ]
      },
      {
        name: 'Databases',
        subs: [
          'RDS: managed relational DB (MySQL, PostgreSQL, Oracle, SQL Server, MariaDB)',
          'RDS Multi-AZ: synchronous standby for automatic failover (HA, NOT read scaling)',
          'RDS Read Replicas: asynchronous copies for read scaling (NOT failover)',
          'Aurora: AWS proprietary, 5x faster than MySQL, auto-scales to 64TB, 6 copies across 3 AZs',
          'DynamoDB: serverless NoSQL key-value/document DB, single-digit millisecond at any scale',
          'ElastiCache: in-memory caching (Redis for persistence/clustering, Memcached for simple caching)',
          'Redshift: OLAP data warehouse for analytics and BI workloads',
          'Athena: serverless SQL queries directly on S3 data (CSV, JSON, Parquet); pay per query',
        ]
      },
      {
        name: 'Networking',
        subs: [
          'VPC: logically isolated private network in AWS',
          'Subnets: public (internet-accessible via IGW) vs private (no direct internet)',
          'Internet Gateway (IGW): allows public subnet resources to reach internet',
          'NAT Gateway: allows private subnet instances to reach internet (outbound only)',
          'Security Groups: stateful, instance-level, allow-only rules (return traffic auto-allowed)',
          'NACLs: stateless, subnet-level, allow + deny rules (must explicitly allow return traffic)',
          'Direct Connect: dedicated private fiber connection to AWS (consistent bandwidth, not internet)',
          'Site-to-Site VPN: encrypted tunnel over public internet between on-premises and VPC',
          'CloudFront: CDN with 400+ edge locations for low-latency global content delivery',
          'Route 53: DNS service + routing policies (Simple, Weighted, Failover, Geolocation, Latency)',
          'Global Accelerator: routes traffic over AWS private network for improved global performance',
          'Transit Gateway: hub-and-spoke to connect thousands of VPCs and on-premises networks',
        ]
      },
    ]
  },
  {
    id: 4, color: '#F59E0B', pct: '12%',
    title: 'Domain 4 — Billing & Pricing',
    topics: [
      {
        name: 'Pricing Models',
        subs: [
          'Pay-as-you-go: only pay for what you use, when you use it',
          'Save when you reserve: commit to 1 or 3 years for significant discounts',
          'Pay less by using more: volume/tiered pricing (S3, data transfer)',
          'Data transfer IN to AWS: always FREE | Data transfer OUT: charged',
        ]
      },
      {
        name: 'Cost Management Tools',
        subs: [
          'AWS Pricing Calculator: estimate costs before deploying (planning tool)',
          'Cost Explorer: visualize, analyze, and forecast spending; identify trends',
          'Cost & Usage Report (CUR): most granular; hourly data by resource/tag; for BI tools',
          'AWS Budgets: set cost/usage/reservation budgets with email/SNS alerts',
          'Trusted Advisor: 5 categories including Cost Optimization (right-sizing, idle resources)',
          'Compute Optimizer: ML-powered right-sizing recommendations for EC2, Lambda, EBS',
          'TCO Calculator: compare on-premises total cost vs AWS migration savings',
          'Consolidated Billing: single bill for all AWS Organizations accounts; share volume discounts',
        ]
      },
      {
        name: 'Support Plans',
        subs: [
          'Basic (FREE): AWS docs, 7 core Trusted Advisor checks, no tech support',
          'Developer ($29/mo): business-hours email support, 12-24 hr general / 12 hr system impaired',
          'Business ($100/mo): 24/7 phone + chat, 1 hr production down, all TA checks, Health API',
          'Enterprise On-Ramp: pool of TAMs, 30 min critical system down, Concierge team',
          'Enterprise: designated TAM, 15 min business-critical down, Concierge team, Well-Architected reviews',
        ]
      },
    ]
  },
];

const TIPS = [
  { title: 'Shared Responsibility shifts by service', text: '<strong>EC2</strong> → you patch the OS. <strong>RDS</strong> → AWS patches OS/DB engine; you manage data & access. <strong>Lambda</strong> → AWS manages everything below the function code. More managed = more AWS responsibility.' },
  { title: 'EC2 pricing decision tree', text: '<strong>On-Demand</strong>: short-term, unpredictable. <strong>Reserved</strong>: steady-state 24/7 workloads (1-3 yr). <strong>Spot</strong>: interruption-tolerant batch/flexible jobs (90% off). <strong>Savings Plans</strong>: flexible commitment across EC2/Lambda/Fargate.' },
  { title: 'Security Groups vs NACLs', text: '<strong>Security Groups</strong>: stateful (auto-allow return traffic), instance-level, allow-only rules. <strong>NACLs</strong>: stateless (must manually allow return traffic), subnet-level, allow + deny rules. When in doubt: SGs protect instances, NACLs protect subnets.' },
  { title: 'CloudTrail vs CloudWatch vs Config', text: '<strong>CloudTrail</strong>: WHO did WHAT API call and WHEN (audit log). <strong>CloudWatch</strong>: performance metrics, alarms, logs (monitoring). <strong>Config</strong>: tracks resource CONFIGURATION changes over time and compliance.' },
  { title: 'S3 storage class selection', text: '<strong>Standard</strong>: frequent access. <strong>IA</strong>: infrequent but fast retrieval. <strong>One-Zone-IA</strong>: non-critical infrequent. <strong>Glacier Instant</strong>: archive with millisecond retrieval. <strong>Glacier Flexible</strong>: minutes-to-hours. <strong>Deep Archive</strong>: cheapest, 12hr retrieval. <strong>Intelligent-Tiering</strong>: unknown/changing patterns.' },
  { title: 'High availability architecture', text: 'HA = <strong>Multi-AZ deployment</strong> + <strong>Auto Scaling</strong> + <strong>Elastic Load Balancing</strong>. RDS Multi-AZ is for failover (HA), NOT performance. Read Replicas are for read scaling, NOT failover. Route 53 failover routing adds DNS-level HA.' },
  { title: 'Database selection guide', text: '<strong>RDS</strong>: relational SQL, managed. <strong>Aurora</strong>: high-performance relational, cloud-native. <strong>DynamoDB</strong>: NoSQL key-value, millisecond scale. <strong>ElastiCache</strong>: in-memory cache layer. <strong>Redshift</strong>: analytics/OLAP warehouse. <strong>Athena</strong>: ad-hoc SQL on S3 files.' },
  { title: 'Global reach services (not region-specific)', text: '<strong>IAM</strong>, <strong>Route 53</strong>, <strong>CloudFront</strong>, <strong>WAF</strong> (global), <strong>Shield</strong>, <strong>Global Accelerator</strong> are all global services. S3 bucket names are globally unique but data stays in chosen region.' },
  { title: 'Trusted Advisor 5 categories', text: '<strong>Cost Optimization</strong> (idle/underutilized resources), <strong>Performance</strong> (service limits, throughput), <strong>Security</strong> (open ports, MFA on root, public S3), <strong>Fault Tolerance</strong> (Multi-AZ, snapshots), <strong>Service Limits</strong> (usage vs limits). Basic/Dev plans get 7 core checks; Business/Enterprise get all checks.' },
  { title: 'Well-Architected 6 Pillars', text: '<strong>Operational Excellence</strong> (run/monitor systems), <strong>Security</strong> (protect data/systems), <strong>Reliability</strong> (recover from failures), <strong>Performance Efficiency</strong> (use resources efficiently), <strong>Cost Optimization</strong> (avoid waste), <strong>Sustainability</strong> (minimize environmental impact).' },
];

const FACTS = [
  { k: 'Passing Score', v: '700 out of 1000' },
  { k: 'Total Questions', v: '65 (50 scored + 15 unscored)' },
  { k: 'Exam Duration', v: '90 minutes' },
  { k: 'S3 Durability', v: '11 nines — 99.999999999%' },
  { k: 'Lambda Max Runtime', v: '15 minutes per invocation' },
  { k: 'EBS Attachment', v: 'One EC2 instance at a time, same AZ only' },
  { k: 'EFS', v: 'Shared file system, multiple EC2, multi-AZ' },
  { k: 'RDS Multi-AZ', v: 'Failover (HA), NOT for read scaling' },
  { k: 'RDS Read Replicas', v: 'Read scaling, NOT for automatic failover' },
  { k: 'CloudTrail Retention', v: 'Default 90 days; archive to S3 for longer' },
  { k: 'Shield Standard', v: 'FREE for all AWS customers, auto-enabled' },
  { k: 'IAM Scope', v: 'Global service — not region-specific' },
  { k: 'Root Account', v: 'Lock it down — enable MFA, don\'t use daily' },
  { k: 'Spot Instances', v: 'Up to 90% savings; can be interrupted by AWS' },
  { k: 'Reserved Instances', v: 'Up to 72% savings; 1 or 3 year commitment' },
  { k: 'Aurora vs RDS MySQL', v: 'Aurora is 5x faster, auto-scales to 64TB' },
  { k: 'Data Transfer IN', v: 'Always FREE; Data OUT to internet is charged' },
  { k: 'Snowball Edge', v: '~80TB offline data transfer appliance' },
  { k: 'Direct Connect', v: 'Dedicated fiber, NOT over public internet' },
  { k: 'NAT Gateway', v: 'Private subnet → internet (outbound only)' },
  { k: 'Availability Zones', v: 'Minimum 3 per AWS Region' },
];

function DomainCard({ domain }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="domain-card">
      <div className="domain-header" style={{ borderLeftColor: domain.color }} onClick={() => setOpen(o => !o)}>
        <div>
          <div className="domain-title">{domain.title}</div>
          <div className="domain-pct">Exam weight: {domain.pct}</div>
        </div>
        <span className={`domain-arrow${open ? ' open' : ''}`}>▶</span>
      </div>
      {open && (
        <div className="topic-list">
          {domain.topics.map((t, i) => (
            <div key={i} className="topic-item">
              <div className="topic-name">{t.name}</div>
              {t.subs.map((s, j) => <div key={j} className="subtopic">{s}</div>)}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState(0);
  const tabs = ['📚 Study Domains', '💡 Exam Tips', '⚡ Quick Facts'];
  return (
    <div>
      <div className="header">
        <h1>☁️ AWS CLF-C02 Study Guide</h1>
        <p>AWS Certified Cloud Practitioner — Complete Study Reference</p>
        <div className="badges">
          <span className="badge" style={{ background: '#3B82F6' }}>Cloud Concepts 24%</span>
          <span className="badge" style={{ background: '#EF4444' }}>Security & Compliance 30%</span>
          <span className="badge" style={{ background: '#10B981' }}>Technology 34%</span>
          <span className="badge" style={{ background: '#F59E0B', color: '#1e293b' }}>Billing & Pricing 12%</span>
        </div>
      </div>
      <div className="container">
        <div className="tabs">
          {tabs.map((t, i) => (
            <button key={i} className={`tab${tab === i ? ' active' : ''}`} onClick={() => setTab(i)}>{t}</button>
          ))}
        </div>

        {tab === 0 && (
          <div>
            {DOMAINS.map(d => <DomainCard key={d.id} domain={d} />)}
          </div>
        )}

        {tab === 1 && (
          <div>
            {TIPS.map((tip, i) => (
              <div key={i} className="tip-card">
                <div className="tip-num">{i + 1}</div>
                <div>
                  <strong style={{ display: 'block', marginBottom: '0.3rem', color: '#1e293b' }}>{tip.title}</strong>
                  <div className="tip-text" dangerouslySetInnerHTML={{ __html: tip.text }} />
                </div>
              </div>
            ))}
          </div>
        )}

        {tab === 2 && (
          <div className="facts-grid">
            {FACTS.map((f, i) => (
              <div key={i} className="fact-card">
                <strong>{f.k}</strong>
                <span>{f.v}</span>
              </div>
            ))}
          </div>
        )}
      </div>
      <div className="nav-links">
        <span style={{ color: '#64748b', fontSize: '0.85rem', alignSelf: 'center' }}>Also:</span>
        <a href="practice-exam.html" className="nav-link">🧪 Practice Exam (50 Q)</a>
        <a href="full-exam.html" className="nav-link">📝 Full Mock Exam (65 Q)</a>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
